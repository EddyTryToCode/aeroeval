services:
  api:
    build: .
    container_name: aeroeval-api
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./experiments:/app/experiments
      - ./configs:/app/configs
    command: uvicorn aeroeval.api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  dashboard:
    build: .
    container_name: aeroeval-dashboard
    ports:
      - "8502:8501"
    volumes:
      - ./reports:/app/reports
      - ./data:/app/data
      - ./configs:/app/configs
    command: streamlit run src/aeroeval/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api
    restart: unless-stopped
