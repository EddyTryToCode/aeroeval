[project]
name = "aeroeval"
version = "0.1.0"
description = "Real-Time UAV Vision & AI Evaluation Platform"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
